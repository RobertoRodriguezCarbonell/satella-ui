# CI (ADR-022): lint → typecheck → test → build → paquetes en cada PR y en cada push.
# `pnpm test` ejecuta los tests unitarios (core, tokens), las historias en Chromium
# (interacción, accesibilidad y regresión visual, ADR-016) y los tests nativos (ADR-017).
# Turborepo ejecuta solo lo afectado por el cambio; la caché remota se activa
# al definir TURBO_TOKEN (secret) y TURBO_TEAM (variable) en el repositorio.
name: CI

on:
  pull_request:
  # En todas las ramas: `main` solo acepta commits que ya han pasado esta CI (ADR-035).
  # Las de Renovate se excluyen porque ya la ejecutan desde su PR.
  push:
    branches-ignore: ['renovate/**']
  # Permite relanzarla a mano; la usa el workflow "Referencias visuales" tras subir capturas.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    name: lint → typecheck → test → build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - name: Instalar Chromium para los tests de historias
        run: pnpm --filter storybook-web exec playwright install --with-deps --only-shell chromium

      # En CI la comparación visual está activa: cada historia se compara con su
      # referencia de packages/ui/src/**/__screenshots__ (ADR-030).
      - run: pnpm test

      - name: Guardar capturas y diffs de los tests visuales fallidos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diferencias-visuales
          path: apps/storybook-web/.vitest/attachments/visual
          if-no-files-found: ignore
          retention-days: 14

      - run: pnpm build

      # Los paquetes tal y como llegarían a npm: publint y una app externa que los instala.
      - run: pnpm check:packages
