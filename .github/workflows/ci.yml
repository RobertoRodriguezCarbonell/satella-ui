# CI (ADR-022): lint → typecheck → test → build en cada PR y en cada push a main.
# `pnpm test` ejecuta los tests unitarios (core, tokens), las historias en Chromium
# (interacción, accesibilidad y regresión visual, ADR-016) y los tests nativos (ADR-017).
# Turborepo ejecuta solo lo afectado por el cambio; la caché remota se activa
# al definir TURBO_TOKEN (secret) y TURBO_TEAM (variable) en el repositorio.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Permite relanzarla a mano; la usa el workflow "Referencias visuales" tras subir capturas.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    name: lint → typecheck → test → build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - name: Instalar Chromium para los tests de historias
        run: pnpm --filter storybook-web exec playwright install --with-deps --only-shell chromium

      - run: pnpm test
        env:
          # Las referencias visuales todavía no existen: se generan con el workflow
          # "Referencias visuales" y esta línea se quita en el commit que las añade.
          VISUAL: 'off'

      - name: Guardar capturas y diffs de los tests visuales fallidos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diferencias-visuales
          path: apps/storybook-web/.vitest/attachments/visual
          if-no-files-found: ignore
          retention-days: 14

      - run: pnpm build
