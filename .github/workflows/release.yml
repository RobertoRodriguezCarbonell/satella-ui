# Release (ADR-021, ADR-022, ADR-031): en cada push a main,
#   - si hay changesets pendientes, crea o actualiza la PR "Version Packages";
#   - si no los hay (se acaba de fusionar esa PR), publica en npm las versiones nuevas.
#
# La publicación usa trusted publishing: el job `publish` se autentica contra npm con
# OIDC, sin ningún token guardado en el repositorio, y npm adjunta la atestación de
# procedencia. Solo ese job tiene `id-token: write`, y no ejecuta código del proyecto:
# publica los .tgz que ha construido el job `pack`.
#
# La primera versión de cada paquete no puede publicarse así, porque npm solo deja
# configurar un trusted publisher en paquetes que ya existen. El arranque está
# documentado en docs/publicacion.md.
name: Release

on:
  push:
    branches: [main]

# Sin permisos por defecto: cada job declara los suyos.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: 0

jobs:
  select-mode:
    name: Versionar o publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version Packages
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Crear o actualizar la PR "Version Packages"
        uses: changesets/action/version@v2
        with:
          script: pnpm changeset version
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'

  pack:
    name: Construir y empaquetar
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Lo mismo que comprueba la CI: publint y una app externa que instala los .tgz.
      - run: pnpm check:packages

      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publicar en npm
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # etiquetas y releases de GitHub
      id-token: write # OIDC: trusted publishing y procedencia
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Trusted publishing necesita npm >= 11.5.1; Node 22 trae una versión anterior.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
