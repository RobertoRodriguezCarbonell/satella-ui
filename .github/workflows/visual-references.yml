# Referencias visuales (ADR-016, ADR-030): regenera las capturas de las historias en el
# mismo entorno en el que la CI las compara (Chromium en ubuntu-latest). Nunca se
# generan en local: el renderizado de fuentes cambia entre sistemas operativos.
#
# Uso: Actions → "Referencias visuales" → Run workflow, eligiendo la rama de la PR.
#   gh workflow run visual-references.yml --ref <rama>
#
# En una rama, sube las capturas como un commit y relanza la CI. En la rama por
# defecto no hace commit: deja las capturas como artefacto para revisarlas y subirlas
# con el cambio que las motiva.
name: Referencias visuales

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Subir las referencias a la rama como un commit
        type: boolean
        default: true

concurrency:
  group: visual-references-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  HUSKY: 0
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  update:
    name: Regenerar referencias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm --filter storybook-web exec playwright install --with-deps --only-shell chromium

      - name: Borrar las referencias anteriores
        # Así no quedan capturas huérfanas de historias renombradas o eliminadas.
        run: find packages/ui/src -type d -name __screenshots__ -prune -exec rm -rf {} +

      - name: Generar las referencias
        run: pnpm exec turbo run test:web -- --update
        env:
          VISUAL: 'on'

      - name: Resumen de cambios
        id: changes
        run: |
          git add --all packages/ui/src
          changed=$(git diff --cached --name-status -- packages/ui/src)
          total=$(find packages/ui/src -path '*/__screenshots__/*.png' | wc -l | tr -d ' ')
          {
            echo "## Referencias visuales"
            echo
            echo "Capturas generadas: **${total}**"
            echo
            if [ -n "$changed" ]; then
              echo "Cambios respecto a \`${GITHUB_REF_NAME}\`:"
              echo
              echo '```'
              echo "$changed"
              echo '```'
            else
              echo "Sin cambios respecto a \`${GITHUB_REF_NAME}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$changed" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Guardar las referencias como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: referencias-visuales
          path: packages/ui/src/**/__screenshots__/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Subir las referencias a la rama
        if: >-
          inputs.commit &&
          steps.changes.outputs.changed == 'true' &&
          github.ref_name != github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(ui): actualizar referencias visuales" \
            -m "Co-authored-by: ${GITHUB_ACTOR} <${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com>"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # Un push hecho con GITHUB_TOKEN no dispara workflows: se relanza la CI a mano.
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
